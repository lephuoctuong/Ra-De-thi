    <meta property="og:title" content="Remix Final - Ngân Hàng Câu Hỏi và Tạo Đề Thi - Nâng Cao (LÊ PHƯỚC TƯỜNG)">
    <meta property="og:description" content="Hệ thống tự động hóa toàn diện quy trình phân tích nguồn tài liệu, thiết lập ma trận đặc tả chuẩn văn bản quy định, tạo đề thi gốc, tạo mã đề hoán đổi, giao bài qua mã QR và thống kê chi tiết sản phẩm bài làm của học sinh dành cho giáo viên.">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

    <!-- DOMPurify for Security -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }

        /* Hiệu ứng Neon nổi bật cho LÊ PHƯỚC TƯỜNG */
        .neon-title {
            color: #ffffff;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-shadow:
                0 0 3px #67e8f9,
                0 0 8px #38bdf8,
                0 0 16px #0284c7,
                0 0 28px #0369a1,
                0 0 45px rgba(2, 132, 199, 0.7);
            animation: neonTitlePulse 2.4s ease-in-out infinite alternate;
        }

        @keyframes neonTitlePulse {
            0% {
                text-shadow:
                    0 0 2px #bae6fd,
                    0 0 6px #38bdf8,
                    0 0 14px #0284c7,
                    0 0 24px #0369a1,
                    0 0 38px rgba(2, 132, 199, 0.65);
                filter: brightness(1.05);
            }
            100% {
                text-shadow:
                    0 0 4px #e0f2fe,
                    0 0 12px #67e8f9,
                    0 0 22px #0ea5e9,
                    0 0 35px #0284c7,
                    0 0 55px rgba(14, 165, 233, 0.95);
                filter: brightness(1.3);
            }
        }

        /* Hiệu ứng Neon cho HỆ THỐNG NGÂN HÀNG & ĐỀ THI */
        .neon-text-badge {
            color: #38bdf8;
            text-shadow:
                0 0 3px #38bdf8,
                0 0 8px rgba(56, 189, 248, 0.9),
                0 0 16px rgba(14, 165, 233, 0.75),
                0 0 28px rgba(2, 132, 199, 0.6),
                0 0 42px rgba(3, 105, 161, 0.4);
            letter-spacing: 0.08em;
            animation: neonPulse 2.8s ease-in-out infinite alternate;
        }

        .neon-box-glow {
            border: 1px solid rgba(56, 189, 248, 0.45);
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15) 0%, rgba(2, 132, 199, 0.06) 100%);
            box-shadow:
                0 0 14px rgba(56, 189, 248, 0.3),
                inset 0 0 10px rgba(56, 189, 248, 0.15);
        }

        @keyframes neonPulse {
            0% {
                text-shadow:
                    0 0 2px #38bdf8,
                    0 0 6px rgba(56, 189, 248, 0.8),
                    0 0 14px rgba(14, 165, 233, 0.65),
                    0 0 24px rgba(2, 132, 199, 0.45);
                filter: brightness(1);
            }
            100% {
                text-shadow:
                    0 0 4px #7dd3fc,
                    0 0 10px rgba(56, 189, 248, 1),
                    0 0 22px rgba(14, 165, 233, 0.95),
                    0 0 36px rgba(2, 132, 199, 0.75),
                    0 0 50px rgba(3, 105, 161, 0.55);
                filter: brightness(1.2);
            }
        }
        @media print {
            @page {
                size: A4 portrait;
                margin: 2cm 1.5cm 2cm 2.5cm; /* Top, Right, Bottom, Left */
            }
            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                font-family: "Times New Roman", Times, serif !important;
                font-size: 13pt !important;
                line-height: 1.45 !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            /* Full layout resets for print */
            #root, main, .min-h-screen, .container, .p-8 {
                padding: 0 !important;
                margin: 0 !important;
                border: none !important;
                box-shadow: none !important;
                background: transparent !important;
                width: auto !important;
                max-width: none !important;
            }
            /* Standardize the exam printable container */
            #print-area, .exam-page {
                display: block !important;
                width: 100% !important;
                min-height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
                border: none !important;
                box-shadow: none !important;
                font-family: "Times New Roman", Times, serif !important;
                color: #000000 !important;
                font-size: 13pt !important;
                background: #ffffff !important;
            }
            /* Question alignment print styles */
            .question-block {
                page-break-inside: avoid !important;
                margin-bottom: 1.25rem !important;
            }
            /* Math standard sizes for printing */
            .katex {
                font-size: 12pt !important;
            }
            .katex-display {
                margin: 0.5rem 0 !important;
                padding: 0 !important;
                page-break-inside: avoid !important;
            }
            /* Standardized exam layout elements */
            .student-info-box {
                border: 1px solid #000000 !important;
                padding: 12px !important;
                margin-bottom: 1.5rem !important;
                font-family: "Times New Roman", Times, serif !important;
                font-size: 11pt !important;
                line-height: 1.6 !important;
            }
            /* Align choices inline or in simple neat list */
            .choices {
                display: block !important;
                margin-left: 1.5rem !important;
                margin-bottom: 0.75rem !important;
            }
            /* Tables format for exam matrices and answers */
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                font-size: 11pt !important;
                margin: 1rem 0 !important;
                page-break-inside: auto !important;
            }
            tr {
                page-break-inside: avoid !important;
            }
            th, td {
                border: 1px solid #000000 !important;
                padding: 6px !important;
                color: #000000 !important;
                background: transparent !important;
                word-wrap: break-word !important;
                overflow-wrap: break-word !important;
            }
            th {
                font-weight: bold !important;
                text-align: center !important;
                background-color: #f3f4f6 !important;
            }
            .page-break {
                page-break-before: always !important;
                break-before: page !important;
            }
            /* SVG figures */
            .figure-container svg {
                max-width: 80% !important;
                margin: 1rem auto !important;
                page-break-inside: avoid !important;
            }
        }
        .print-only { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* STEM Optimization & KaTeX Fixes */
        .katex { 
            font-size: 1.05em; 
            line-height: 1.2; 
            white-space: normal; 
        }
        
        .katex-display { 
            overflow-x: auto !important; 
            overflow-y: hidden !important; 
            padding: 1.2rem 0;
            margin: 1.5rem 0;
            text-align: center;
            scrollbar-width: thin;
        }

        /* Tinh chỉnh khoảng cách cho inline math */
        .math-inline-wrapper {
            display: inline-block;
            padding: 0 0.25rem;
            vertical-align: middle;
            line-height: 1.4;
        }

        /* Tinh chỉnh khoảng cách cho block math */
        .math-block-wrapper {
            margin: 1.2rem 0;
            display: block;
            clear: both;
        }
        
        .figure-container svg {
            max-width: 100%;
            height: auto;
            margin: 1.5rem auto;
            display: block;
        }
        
        .latex-container {
            line-height: 1.7;
        }

        /* KaTeX Error Handling CSS */
        .katex-error {
            color: #e11d48 !important; /* Rose 600 */
            background-color: #fff1f2; /* Rose 50 */
            border: 1px solid #fecaca; /* Rose 200 */
            padding: 2px 8px;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.85em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0 2px;
            font-weight: 500;
        }

        .katex-error::before {
            content: "⚠️ Công thức lỗi:";
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            background: #e11d48;
            color: white;
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
        }
    </style>
